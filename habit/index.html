<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8f5">
<title>每日习惯 · 打卡</title>
<style>
  :root{
    --ink:#26342d; --muted:#8a958d; --green:#4f8a6b; --green-dark:#3f7258;
    --line:#e6ebe6; --paper:#ffffff; --bg:#f7f8f5; --done-bg:#f0f7f1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{width:min(100% - 40px,640px);margin:0 auto;padding:56px 0 64px;}
  .eyebrow{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
  h1{margin:10px 0 6px;font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-weight:500;
     font-size:clamp(32px,7vw,42px);letter-spacing:-.02em;}
  .date{margin:0;color:var(--muted);font-size:14px;}
  .summary{display:flex;align-items:center;gap:20px;margin:30px 0 26px;padding:20px 22px;
     background:var(--paper);border:1px solid var(--line);border-radius:20px;
     box-shadow:0 10px 30px rgba(38,52,45,.05);}
  .ring-wrap{position:relative;width:70px;height:70px;flex:none;}
  .ring{width:100%;height:100%;transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:8;stroke-linecap:round;}
  .ring-bg{stroke:#e9f0ea;}
  .ring-fg{stroke:var(--green);transition:stroke-dashoffset .5s ease;}
  .ring-center{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--green);}
  .summary strong{display:block;font-size:17px;font-weight:700;margin-bottom:4px;}
  .summary small{color:var(--muted);font-size:13px;line-height:1.5;}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;}
  .section-head h2{margin:0;font-size:15px;font-weight:700;}
  .section-head span{color:var(--muted);font-size:12px;}
  .list{display:grid;gap:10px;}
  .habit{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--paper);
    border:1px solid var(--line);border-radius:16px;transition:background .18s,border-color .18s,transform .18s;}
  .habit.done{background:var(--done-bg);border-color:#d8e9dc;}
  .check{display:grid;place-items:center;width:27px;height:27px;flex:none;border-radius:50%;
    border:2px solid #cfd9d1;background:#fff;color:#fff;cursor:pointer;padding:0;transition:.18s;}
  .check:hover{border-color:var(--green);}
  .check svg{width:14px;height:14px;transform:scale(0);transition:transform .15s cubic-bezier(.34,1.56,.64,1);}
  .done .check{background:var(--green);border-color:var(--green);}
  .done .check svg{transform:scale(1);}
  .main{flex:1;min-width:0;}
  .name{overflow-wrap:anywhere;font-size:15px;}
  .done .name{color:#7e9183;text-decoration:line-through;text-decoration-color:#b8cabb;}
  .streak{display:none;color:#9aa59c;font-size:12px;margin-top:3px;}
  .streak.show{display:block;}
  .delete{border:0;background:none;color:#b9c1ba;font-size:22px;line-height:1;cursor:pointer;padding:6px 4px;flex:none;}
  .delete:hover{color:#c1665d;}
  .empty{padding:28px 16px;border:1px dashed #dbe2db;border-radius:16px;color:var(--muted);text-align:center;font-size:14px;}
  form{display:flex;gap:10px;margin-top:20px;}
  input{flex:1;min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;
    color:var(--ink);font:inherit;font-size:14px;outline:none;}
  input:focus{border-color:#a8c8b2;box-shadow:0 0 0 4px rgba(79,138,107,.12);}
  input::placeholder{color:#a7b0a9;}
  .add{flex:none;padding:0 22px;border:0;border-radius:14px;background:var(--green);color:#fff;
    font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.18s;}
  .add:hover{background:var(--green-dark);}
  .add:active{transform:scale(.97);}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-top:22px;
    box-shadow:0 10px 30px rgba(38,52,45,.04);}
  .panel .section-head{margin-bottom:12px;}
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{border:1px solid var(--line);background:#fff;border-radius:9px;width:28px;height:28px;
    cursor:pointer;color:var(--ink);font-size:16px;line-height:1;padding:0;}
  .month-nav button:hover{border-color:var(--green);color:var(--green);}
  #month-label{font-size:13px;font-weight:700;min-width:88px;text-align:center;}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .week span{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .day{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:13px;cursor:pointer;
    color:var(--ink);background:transparent;border:0;font-family:inherit;}
  .day:not(.blank):hover{background:#eef3ee;}
  .day.done{background:#e3efe6;color:var(--green);font-weight:700;}
  .day.today{box-shadow:inset 0 0 0 2px var(--green);}
  .day.selected{background:var(--green)!important;color:#fff!important;box-shadow:none!important;}
  .day.blank{cursor:default;}
  .cal-detail{margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.6;min-height:18px;}
  .reminder{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .reminder input[type=time]{flex:none;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
    font:inherit;font-size:14px;color:var(--ink);background:#fff;}
  .ghost{border:1px solid var(--green);background:#fff;color:var(--green);border-radius:12px;padding:10px 16px;
    font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.18s;}
  .ghost:hover{background:var(--green);color:#fff;}
  .ghost.on{background:var(--green);color:#fff;}
  .hint{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.6;}
  .link-btn{border:0;background:none;color:var(--green);font:inherit;font-size:12px;cursor:pointer;padding:0;
    margin-left:8px;text-decoration:underline;}
  .foot{margin:30px 0 0;color:#a3aca4;text-align:center;font-size:12px;}
  @media(max-width:480px){.wrap{padding-top:40px}.summary{margin-top:24px;padding:18px}.panel{padding:16px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="eyebrow">A LITTLE EVERY DAY</div>
    <h1>每日习惯</h1>
    <p class="date" id="today"></p>
  </header>

  <section class="summary" aria-live="polite">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="ring-center" id="percent">0%</div>
    </div>
    <div>
      <strong id="summary-title">今天，完成一小步</strong>
      <small id="summary-detail">每一次坚持，都值得记录。</small>
    </div>
  </section>

  <section aria-label="今日习惯">
    <div class="section-head"><h2>今天要做的事</h2><span id="count-label"></span></div>
    <div class="list" id="list"></div>
  </section>

  <form id="add-form" autocomplete="off">
    <input id="habit-input" maxlength="60" placeholder="添加一个想坚持的习惯，如：喝水、运动、读书…" aria-label="新习惯名称">
    <button class="add" type="submit">添加</button>
  </form>

  <section class="panel" aria-label="打卡日历">
    <div class="section-head">
      <h2>打卡日历</h2>
      <div class="month-nav">
        <button id="prev-month" aria-label="上个月">‹</button>
        <span id="month-label"></span>
        <button id="next-month" aria-label="下个月">›</button>
      </div>
    </div>
    <div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="grid" id="calendar"></div>
    <p class="cal-detail" id="cal-detail"></p>
  </section>

  <section class="panel" aria-label="每日提醒">
    <div class="section-head"><h2>每日提醒</h2></div>
    <div class="reminder">
      <input type="time" id="remind-time" value="21:00" aria-label="提醒时间">
      <button id="remind-toggle" class="ghost">开启提醒</button>
    </div>
    <p class="hint">开启后，只要这个页面保持打开，到设定时间且当天还有未完成的习惯时，就会弹出通知。<button class="link-btn" id="test-remind">发送测试通知</button></p>
  </section>

  <p class="foot">慢慢来，也很好。</p>
</main>

<script>
(() => {
  const HABITS_KEY = 'daily-habits-v1';
  const CHECKS_KEY = 'daily-habit-checks-v1';
  const REMIND_TIME_KEY = 'daily-habit-remind-time-v1';
  const REMIND_ON_KEY = 'daily-habit-remind-on-v1';
  const REMINDED_KEY = 'daily-habit-reminded-v1';
  const R = 52, CIRC = 2 * Math.PI * R;

  const listEl = document.getElementById('list');
  const input = document.getElementById('habit-input');
  const form = document.getElementById('add-form');
  const checkIcon = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m4.5 10.2 3.5 3.4 7.5-7.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const todayKey = () => keyOf(new Date());
  const read = (key, fallback) => { try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; } };

  let habits = read(HABITS_KEY, []);
  let checks = read(CHECKS_KEY, {});
  if (!Array.isArray(habits)) habits = [];
  if (!checks || typeof checks !== 'object' || Array.isArray(checks)) checks = {};

  const save = () => {
    localStorage.setItem(HABITS_KEY, JSON.stringify(habits));
    localStorage.setItem(CHECKS_KEY, JSON.stringify(checks));
  };

  const doneOn = (id, key) => Boolean(checks[key] && checks[key][id]);
  const habitsDoneOn = key => habits.filter(h => doneOn(h.id, key));
  const streakOf = id => {
    let streak = 0;
    const d = new Date();
    if (!doneOn(id, keyOf(d))) d.setDate(d.getDate() - 1);
    while (doneOn(id, keyOf(d))) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  };

  // 打卡日历
  const calGrid = document.getElementById('calendar');
  const monthLabel = document.getElementById('month-label');
  const calDetail = document.getElementById('cal-detail');
  const now = new Date();
  let viewYear = now.getFullYear(), viewMonth = now.getMonth();
  let selectedDay = new Date(viewYear, viewMonth, now.getDate());

  const renderCalDetail = () => {
    const key = keyOf(selectedDay);
    const doneList = habitsDoneOn(key);
    const label = `${selectedDay.getMonth()+1} 月 ${selectedDay.getDate()} 日`;
    calDetail.textContent = doneList.length
      ? `${label}：${doneList.map(h => h.name).join('、')}`
      : `${label}：这一天没有打卡记录。`;
  };

  const renderCalendar = () => {
    monthLabel.textContent = `${viewYear} 年 ${viewMonth + 1} 月`;
    const first = new Date(viewYear, viewMonth, 1);
    const offset = first.getDay();
    const days = new Date(viewYear, viewMonth + 1, 0).getDate();
    calGrid.replaceChildren();
    for (let i = 0; i < offset; i++) {
      const blank = document.createElement('div');
      blank.className = 'day blank';
      calGrid.append(blank);
    }
    for (let d = 1; d <= days; d++) {
      const date = new Date(viewYear, viewMonth, d);
      const key = keyOf(date);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'day';
      const count = habitsDoneOn(key).length;
      if (count) cell.classList.add('done');
      if (key === todayKey()) cell.classList.add('today');
      if (key === keyOf(selectedDay)) cell.classList.add('selected');
      cell.textContent = String(d);
      cell.setAttribute('aria-label', `${viewYear}年${viewMonth+1}月${d}日，完成 ${count} 项`);
      cell.addEventListener('click', () => {
        selectedDay = new Date(viewYear, viewMonth, d);
        renderCalendar();
      });
      calGrid.append(cell);
    }
    renderCalDetail();
  };

  document.getElementById('prev-month').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    selectedDay = new Date(viewYear, viewMonth, 1);
    renderCalendar();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    selectedDay = new Date(viewYear, viewMonth, 1);
    renderCalendar();
  });

  // 每日提醒
  const remindTimeInput = document.getElementById('remind-time');
  const remindToggle = document.getElementById('remind-toggle');
  const testRemind = document.getElementById('test-remind');
  let remindOn = localStorage.getItem(REMIND_ON_KEY) === '1';
  let remindTime = localStorage.getItem(REMIND_TIME_KEY) || '21:00';
  let remindedOn = localStorage.getItem(REMINDED_KEY) || '';
  remindTimeInput.value = remindTime;

  const updateRemindUI = () => {
    remindToggle.textContent = remindOn ? '提醒已开启' : '开启提醒';
    remindToggle.classList.toggle('on', remindOn);
    remindTimeInput.disabled = remindOn;
  };

  const notify = (title, body) => {
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body });
      }
    } catch (e) { /* 忽略通知异常 */ }
  };

  remindToggle.addEventListener('click', async () => {
    if (remindOn) {
      remindOn = false;
      localStorage.setItem(REMIND_ON_KEY, '0');
      updateRemindUI();
      return;
    }
    if (!('Notification' in window)) {
      alert('当前浏览器不支持网页通知，请使用 Chrome 或 Edge 打开。');
      return;
    }
    let perm = Notification.permission;
    if (perm === 'default') perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      alert('需要允许通知权限，才能每天提醒你打卡。');
      return;
    }
    remindOn = true;
    remindTime = remindTimeInput.value || '21:00';
    remindedOn = '';
    localStorage.setItem(REMIND_ON_KEY, '1');
    localStorage.setItem(REMIND_TIME_KEY, remindTime);
    localStorage.removeItem(REMINDED_KEY);
    updateRemindUI();
  });

  remindTimeInput.addEventListener('change', () => {
    if (!remindOn) {
      remindTime = remindTimeInput.value || '21:00';
      localStorage.setItem(REMIND_TIME_KEY, remindTime);
    }
  });

  testRemind.addEventListener('click', () => {
    if (!('Notification' in window) || Notification.permission !== 'granted') {
      alert('请先开启提醒，并允许浏览器通知权限。');
      return;
    }
    notify('习惯打卡提醒', '测试通知：现在提醒你完成今天的习惯。');
  });

  setInterval(() => {
    if (!remindOn) return;
    const d = new Date();
    const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const key = todayKey();
    if (time === remindTime && remindedOn !== key) {
      const total = habits.length;
      const doneCount = habitsDoneOn(key).length;
      if (total && doneCount < total) {
        notify('习惯打卡提醒', `今天还有 ${total - doneCount} 项习惯未完成，回来打个卡吧。`);
        remindedOn = key;
        localStorage.setItem(REMINDED_KEY, remindedOn);
      }
    }
  }, 30000);

  // 今日列表与汇总
  const render = () => {
    const dateKey = todayKey();
    document.getElementById('today').textContent =
      new Intl.DateTimeFormat('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' }).format(new Date());
    if (!checks[dateKey] || typeof checks[dateKey] !== 'object') checks[dateKey] = {};

    const total = habits.length;
    const doneCount = habits.filter(h => doneOn(h.id, dateKey)).length;
    const percent = total ? Math.round(doneCount / total * 100) : 0;

    document.getElementById('percent').textContent = `${percent}%`;
    const fg = document.getElementById('ring-fg');
    fg.style.strokeDasharray = `${CIRC}`;
    fg.style.strokeDashoffset = `${CIRC * (1 - percent / 100)}`;

    const title = document.getElementById('summary-title');
    const detail = document.getElementById('summary-detail');
    if (total && doneCount === total) {
      title.textContent = '太棒了，今天全部完成！';
      detail.textContent = `已完成 ${doneCount} / ${total} 个习惯，为自己点赞。`;
    } else {
      title.textContent = total ? `今天完成 ${doneCount} 项` : '今天，完成一小步';
      detail.textContent = total ? `已完成 ${doneCount} / ${total} 个习惯，继续保持自己的节奏。` : '添加一个习惯，开始记录你的每一步。';
    }
    document.getElementById('count-label').textContent = total ? `${doneCount} / ${total} 已完成` : '';

    listEl.replaceChildren();
    if (!total) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有习惯，添加一项开始吧。';
      listEl.append(empty);
    } else {
      habits.forEach(habit => {
        const done = doneOn(habit.id, dateKey);
        const row = document.createElement('div');
        row.className = 'habit' + (done ? ' done' : '');

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'check';
        toggle.setAttribute('aria-pressed', String(done));
        toggle.setAttribute('aria-label', done ? `取消「${habit.name}」打卡` : `完成「${habit.name}」`);
        toggle.innerHTML = done ? checkIcon : '';
        toggle.addEventListener('click', () => {
          checks[dateKey][habit.id] = !checks[dateKey][habit.id];
          save(); render();
        });

        const main = document.createElement('div');
        main.className = 'main';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = habit.name;
        main.append(name);

        const streak = streakOf(habit.id);
        if (streak >= 1) {
          const s = document.createElement('div');
          s.className = 'streak show';
          s.textContent = `🔥 已连续打卡 ${streak} 天`;
          main.append(s);
        }

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete';
        del.textContent = '×';
        del.setAttribute('aria-label', `删除「${habit.name}」`);
        del.addEventListener('click', () => {
          habits = habits.filter(h => h.id !== habit.id);
          Object.values(checks).forEach(day => { if (day && typeof day === 'object') delete day[habit.id]; });
          save(); render();
        });

        row.append(toggle, main, del);
        listEl.append(row);
      });
    }

    renderCalendar();
  };

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    habits.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, name });
    input.value = '';
    save(); render();
    input.focus();
  });

  updateRemindUI();
  render();
})();
</script>
</body>
</html>
